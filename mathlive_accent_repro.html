<!doctype html>
<meta charset="utf-8">
<title>MathLive 0.104.2 accent focus reproduction</title>
<script src="./mathlive.min.js"></script>
<style>
  body { font: 16px sans-serif; padding: 24px; }
  math-field { display: block; margin: 16px 0; min-height: 42px; border: 1px solid #aaa; }
  button { margin-right: 8px; }
  pre { white-space: pre-wrap; background: #f4f4f4; padding: 12px; }
</style>
<button id="accent">Insert \hat{\placeholder{}}</button>
<button id="sqrt">Insert \sqrt{\placeholder{}}</button>
<button id="wrapped">Insert \hat{#@} with no selection</button>
<math-field id="mf"></math-field>
<pre id="out"></pre>
<script>
const mf = document.querySelector('#mf');
const out = document.querySelector('#out');
function report(label) {
  const r = mf.selection && mf.selection.ranges;
  out.textContent += `${label}\n` +
    `value=${mf.getValue('latex')}\n` +
    `selection=${JSON.stringify(r)}\n` +
    `active=${document.activeElement === mf} activeTag=${document.activeElement && document.activeElement.tagName}\n` +
    `shadowActive=${!!(mf.shadowRoot && mf.shadowRoot.activeElement)}\n\n`;
}
function insert(value) {
  mf.focus();
  mf.insert(value, {format: 'latex', selectionMode: 'placeholder', focus: true});
  report(value);
}
document.querySelector('#accent').onclick = () => insert('\\hat{\\placeholder{}}');
document.querySelector('#sqrt').onclick = () => insert('\\sqrt{\\placeholder{}}');
document.querySelector('#wrapped').onclick = () => insert('\\hat{\\placeholder{}}');
mf.addEventListener('focusin', () => report('focusin'));
mf.addEventListener('focusout', () => report('focusout'));
mf.addEventListener('input', () => report('input'));
report('ready');
</script>
